<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <!-- タイトル（青文字） -->
  <title>匿名掲示板「hello every day」</title>

  <!-- 説明文（下の小さい文字） -->
  <meta name="description" content="現在中１の私が作った匿名掲示板、完成すると思う、使ってもらえると幸いです。バグ報告はｘまたはサイト内バグ報告へｘの連絡先はサイト内記載">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index, follow">
<link rel="icon" href="favicon.png">
  <meta property="og:image" content="https://akion-heya.github.io/hello-every-day/logo.png">
<meta property="og:url" content="https://akion-heya.github.io/hello-every-day/">
<meta property="og:type" content="website">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
</head>
<body style="text-align:center;">

<img src="logo.png" style="width:33%;"><br><br>

<input id="name" placeholder="名前"><br>
<input id="email" placeholder="メール"><br>
<textarea id="text" placeholder="本文"></textarea><br>
<button onclick="post()">投稿</button>

<hr>

<div id="posts"></div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// 君のFirebase設定
const firebaseConfig = {
  apiKey: "AIzaSyAUWVKiU73B8K_8TaXzB25VtutUQea7arA",
  authDomain: "hello-every-day.firebaseapp.com",
  projectId: "hello-every-day"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 投稿
window.post = async function () {
  let name = document.getElementById("name").value;
  let email = document.getElementById("email").value;
  let text = document.getElementById("text").value;

  if (name === "") name = "名無し君";

  await addDoc(collection(db, "posts"), {
    name,
    email,
    text,
    time: Date.now()
  });
};

// リアルタイム表示
const q = query(collection(db, "posts"), orderBy("time"));

onSnapshot(q, (snapshot) => {
  const postArea = document.getElementById("posts");
  postArea.innerHTML = "";

  snapshot.forEach((doc) => {
    const data = doc.data();

    postArea.innerHTML += `
      <div>
        <b>${data.name}</b> (${data.email})<br>
        ${data.text}
        <hr>
      </div>
    `;
  });
});
</script>

</body>
</html>
