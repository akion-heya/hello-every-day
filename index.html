  if (!currentThread) {

  await addDoc(collection(db, "threads", currentThread, "posts"), {
    name,
    email,
    text,

  });
};
 window.sendFeedback = async function () {
  let type = document.getElementById("type").value;
  let text = document.getElementById("feedback").value;

  if (text === "") return;

  await addDoc(collection(db, "feedback"), {
    type,
    text,
    time: Date.now()
  });

  alert("送信しました！");
}; 
window.openThread = function (id) {

  );


};

window.createThread = async function () {
  let title = document.getElementById("threadTitle").value;

  await addDoc(collection(db, "threads"), {
    title,
    time: Date.now()
  });
};


const threadQuery = query(collection(db, "threads"), orderBy("time", "desc"));

onSnapshot(threadQuery, (snapshot) => {

snapshot.forEach((snap) => {

  `;

     await deleteDoc(doc(db, "threads", snap.id));
