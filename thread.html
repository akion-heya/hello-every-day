<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>スレッド</title>
</head>

<body>
<a href="index.html">← スレ一覧に戻る</a>
<h2 id="title">読み込み中...</h2>

<div id="posts"></div>

<hr>

<input id="name" placeholder="名無し君"><br>
<textarea id="text" placeholder="本文"></textarea><br>
  <input type="file" id="image">
<button onclick="post()">投稿</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
  getFirestore, doc, getDoc, collection, addDoc, onSnapshot, query, orderBy, deleteDoc 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } 
  
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
    
  import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
   setDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

window.reply = function (num) {
  const textarea = document.getElementById("text");
  textarea.value += ">>" + num + "\n";
  textarea.focus();
};
 　



window.deleteComment = async (id) => {
  if (!confirm("削除する？")) return;

await deleteDoc(doc(db, "threads", threadId, "posts", id));
  alert("削除した");

};
const firebaseConfig = {
  apiKey: "AIzaSyAUWVKiU73B8K_8TaXzB25VtutUQea7arA",
  authDomain: "hello-every-day.firebaseapp.com",
  projectId: "hello-every-day"
};

const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
const storage = getStorage(app);
const auth = getAuth(app);
  let isAdminFlag = false;
let isReady = false;
  let currentUid = null;
const NG_WORDS = ["死ね", "バカ", "消えろ"]; // ←あとで自由に追加
function isAdmin() {
  return auth.currentUser != null;
}


// URLからID取得
const urlParams = new URLSearchParams(window.location.search);
const threadId = urlParams.get("id");


if (!threadId) {

  document.getElementById("title").innerText = "スレが見つかりません";
} else {
  const threadRef = doc(db, "threads", threadId);
  const threadDoc = await getDoc(threadRef);

  if (threadDoc.exists()) {
    document.getElementById("title").innerText = threadDoc.data().title;
  } else {
    document.getElementById("title").innerText = "削除されたスレです";
  }
}
// 投稿
window.post = async function () {
  if (!threadId) {
    alert("スレを選んでください");
    return;
  }

  // UID未取得ガード
  if (!currentUid) {
    alert("読み込み中です。少し待ってから投稿してください。");
    return;
  }

  // 🔴 BANチェック
  if (await isBanned(currentUid)) {
    alert("あなたはBANされています");
    return;
  }

  let name = document.getElementById("name").value;
  
  let text = document.getElementById("text").value;

  if (!text) return;
  if (!name) name = "名無し君";

  await addDoc(collection(db, "threads", threadId, "posts"), {
    name,
  
    text,
    uid: currentUid,   // ← 必須（後で誰をBANするかに使う）
    time: Date.now()
  });

  document.getElementById("text").value = "";
};

// 投稿表示
const q = query(
  collection(db, "threads", threadId, "posts"),
  orderBy("time")
);


  onAuthStateChanged(auth, async (user) => {
  if (!user) {
    await signInAnonymously(auth);
    return;
  }

  currentUid = user.uid;

  const userRef = doc(db, "users", currentUid);
  const snap = await getDoc(userRef);

  if (!snap.exists()) {
    await setDoc(userRef, {
      role: "user",
      createdAt: Date.now()
    });
  }

  const data = (await getDoc(userRef)).data();
  isAdminFlag = data.role === "admin";
    isReady = true;
startSnapshot();
  
   
});
  function startSnapshot() {
  const q = query(
    collection(db, "threads", threadId, "posts"),
    orderBy("time")
  );
  }
  onSnapshot(q, (snapshot) => {
  

  const postArea = document.getElementById("posts");
  postArea.innerHTML = "";

  let count = 1;

  snapshot.forEach((docSnap) => {
    const data = docSnap.data();
    const id = docSnap.id;

    const div = document.createElement("div");

    let html = `
      <div id="post-${count}">
        <span onclick="reply(${count})" style="color:blue; cursor:pointer;">
          ${count}
        </span>
        名前：${data.name}<br>
        ${data.text}
        ${data.imageUrl ? `<br><img src="${data.imageUrl}" style="max-width:200px;">` : ""}
    `;

    // 管理者削除ボタン
    if (isAdminFlag) {
      html += `<br><button onclick="deleteComment('${id}')">削除</button>`;
    }

    html += `<hr></div>`;

    div.innerHTML = html;

    // 通報ボタン
    const reportBtn = document.createElement("button");
    reportBtn.textContent = "通報";

    reportBtn.onclick = async () => {
      if (!confirm("通報しますか？")) return;

      const note = prompt("備考（空欄OK）") || "";

      await addDoc(collection(db, "reports"), {
        type: "comment",
        targetId: id,
        content: data.text,
        note,
        time: Date.now()
      });

      alert("通報しました");
    };

    div.appendChild(reportBtn);

    postArea.appendChild(div);

    count++;
  });
});
  async function isBanned(uid) {
  const ref = doc(db, "bans", uid);
  const snap = await getDoc(ref);
  return snap.exists();
}
</script>

</body>
</html>
